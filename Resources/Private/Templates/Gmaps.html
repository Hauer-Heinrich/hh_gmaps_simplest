<f:comment>
    <f:if condition="{data.header}">
        {data.header}<br />
    </f:if>

    <f:if condition="{data.subheader}">
        {data.subheader}<br />
    </f:if>

    <f:if condition="{data.header_link}">
        <f:link.page pageUid="{data.header_link}">{data.header_link}</f:link.page><br />
    </f:if>

    <f:if condition="{data.header_layout}">
        <f:switch expression="{data.header_layout}">
            <f:case value="1">Value is: 1</f:case>
            <f:case value="2">Value is: 2</f:case>
            <f:case value="3">Value is: 3</f:case>
        </f:switch><br />
    </f:if>

    <f:if condition="{data.header_position}">
        <f:switch expression="{data.header_position}">
            <f:case value="1">Value is: 1</f:case>
            <f:case value="2">Value is: 2</f:case>
            <f:case value="3">Value is: 3</f:case>
        </f:switch><br />
    </f:if>
</f:comment>

<div id="wrapper" class="map-wrapper">
    <f:if condition="{data.tx_hhgmapssimplest_gmaps_key}">
        <f:then>
            <f:render section="default" arguments="{_all}" />
        </f:then>
        <f:else>
            <p class="error" style="background-color: red; color: #fff; padding: 10px;">No Googlemaps API-Key given!</p>
        </f:else>
    </f:if>
</div>

<f:section name="default">
    <div id="map_canvas" class="gmaps_map"></div>
    <div id="map_direction" class="gmaps_direction" style="background-color:#FFF;display:none;padding-left:6%;padding-right:6%;"><p>Ihre Route (<span class="btn_print_contact">drucken</span>): <span id="total"></span></p></div>
  <!-- STARTING MAP DEFINITION -->
  <script src="<f:format.raw>{f:uri.external(uri: 'https://maps.google.com/maps/api/js?language=de&key={data.tx_hhgmapssimplest_gmaps_key}')}</f:format.raw>"></script>
    <script>
        var rendererOptions = {
            draggable: true
        };
        var map_direction = new google.maps.DirectionsRenderer(rendererOptions);
        var direction_service = new google.maps.DirectionsService();
        var map;
        var start = new google.maps.LatLng(0.0, 0.0);
        var geocoder = new google.maps.Geocoder();
        var owncenter = new google.maps.LatLng(48.542443, 13.235514);
        // Initalize your map
        function initialize() {
            var width = document.documentElement.clientWidth;
            if(width < 750) {
                document.getElementById('map_canvas').style.height = '500px';
            } else {
                document.getElementById('map_canvas').style.height = '600px';
            }
            var myOptions = {
                center: owncenter,
                zoom: zoom,
                mapTypeId: google.maps.MapTypeId.ROADMAP,
                scrollwheel: false,
                panControl: true,
            };
            map = new google.maps.Map(document.getElementById("map_canvas"), myOptions);
            map_direction.setMap(map);
            map_direction.setPanel(document.getElementById("map_direction"));
        }
        // Collect entered data and open Google Maps in a new browser tab
        function showRoute() {
            var style = document.getElementById("map_direction").style.display = 'block';
            var start = document.getElementById("address").value;
            var dest_url = {
                    origin:start,
                    destination: destination,
                    travelMode: google.maps.DirectionsTravelMode.DRIVING
            };
            direction_service.route(dest_url, function(response, status) {
                if (status == google.maps.DirectionsStatus.OK) {
                    map_direction.setDirections(response);
                }
            });
        }
    </script>
    <script>
        // Define infobox widget
        function codeAddress() {
            var address = destination;
            <f:comment></f:comment>var markerText = "<f:if condition='{data.tx_hhgmapssimplest_marker_text}'><f:format.html parseFuncTSPath="lib.parseFunc_RTE">{data.tx_hhgmapssimplest_marker_text}</f:format.html></f:if>";
            geocoder.geocode( { 'address': address }, function(results, status) {
                if (status == google.maps.GeocoderStatus.OK) {
                    map.setCenter(results[0].geometry.location);
                    var coordInfoWindow = new google.maps.InfoWindow({
                        content: "<div class='infoWindow'>"+markerText+"Bitte geben Sie Ihre Adresse ein:</p><input id='address' type='textbox' value='' style='border: 1px solid #f0f0f0;-webkit-border-radius: 8px;-moz-border-radius: 8px;border-radius: 8px;'> <input type='button' value='Start' onClick='showRoute();'></div>",
                        map: map,
                        position: results[0].geometry.location
                    });
                } else {
                    console.log("Geocode not available: " + status);
                }
            });
        }
        // Automatic geo localisation
        function codeLatLng() {
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var pos = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
                    geocoder.geocode({'latLng': pos}, function(results, status) {
                        if (status == google.maps.GeocoderStatus.OK) {
                            if (results[1]) {
                                document.getElementById("address").value = results[1].formatted_address;
                            } else {
                                console.log("No results found");
                            }
                        } else {
                            console.log("Geocoder failed due to: " + status);
                        }
                    });
                }, function() {
                    //
                });
            }
        }
        // DO NOT CHANGE CODE ABOVE!
        // Change custom parameters starting from here:
        var zoom = 11; // map zoom
        var destination = <f:if condition="{data.tx_hhgmapssimplest_marker_dest}">"{data.tx_hhgmapssimplest_marker_dest}"</f:if>; // destination, your address
        document.getElementById('map_canvas').style.width = '100%'; // map width
        google.maps.event.addDomListener(window, 'load', initialize(), codeAddress());
        window.addEventListener('resize', function(event){
            initialize(); codeAddress();
            //, codeLatLng()
        });
    </script>
  <!-- END OF MAP DEFINITION -->
    <script>
        /**
         * Print function
         * @public
         * @param {Element} content  the element to which should be printed
         */
        function printMapsRoute(content) {
            var win=null;
            win = window.open();
            self.focus();
            win.document.open();
            win.document.write('<html><head><style>');
            win.document.write('html, body { float: left; display: block; max-width: 800px; width: 100%; } body, td, th { font-family: Verdana; font-size: 10pt; text-align: left; } thead { font-size: 10pt; } h1 { font-family: Verdana; font-size: 12pt; } h2 { font-family: Verdana; font-size: 10pt; }.contenttable { border-collapse: separate; border-spacing: 0; color:#706f6f; clear: both; margin: 0 auto; width: 100%; }b {color:#706f6f;}.tx-powermail {display:none;}');
            win.document.write('</style></head><body>');
            win.document.write(content);
            win.document.write('</body></html>');
            win.document.close();
            setTimeout(function() {
                win.print();
                win.close();
            }, 2000);
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (window.NodeList && !NodeList.prototype.forEach) {
                NodeList.prototype.forEach = Array.prototype.forEach;
            }

            let gmapsWrapperK = document.querySelectorAll(".map-wrapper");
            if(gmapsWrapperK) {
                gmapsWrapperK.forEach(function(element) {
                    var gmapsDirection = element.querySelector(".gmaps_direction"),
                        gmapsBtnPrint = gmapsDirection.querySelector(".btn_print_contact");
                    if(gmapsBtnPrint) {
                        gmapsBtnPrint.addEventListener("click", function(event) {
                            event.preventDefault();
                            printMapsRoute(gmapsDirection.innerHTML);
                        });
                    }
                });
            }
        });
    </script>
</f:section>
